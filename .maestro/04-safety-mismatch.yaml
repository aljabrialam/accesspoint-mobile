appId: host.exp.Exponent
name: Safety 1 - self-checkout total is ten times the item price
tags: [scenario, safety]
---
- runFlow: subflows/close-open-guide.yaml
- openLink: exp://127.0.0.1:8081/--/guide/mismatch
- extendedWaitUntil:
    visible: ".*for one milk.*"
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: "That total looks wrong"
- assertVisible: "Stopped"
- takeScreenshot: e2e-screenshots/mismatch-1-stop
- tapOn:
    id: "action-I pressed Cancel"

- assertVisible: "Cancelled. Nothing was paid."
- takeScreenshot: e2e-screenshots/mismatch-2-safe
- tapOn:
    id: "action-OK, thanks"

- assertVisible: "Stopped safely. Nothing was paid."
- assertVisible: "S$ 0"
- takeScreenshot: e2e-screenshots/mismatch-3-done
- tapOn:
    id: "action-Finish"
