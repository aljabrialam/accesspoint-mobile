appId: host.exp.Exponent
name: Safety screen lists the guardrails for each Meta model
tags: [safety, guardrails]
---
- runFlow: subflows/close-open-guide.yaml
- runFlow:
    when:
      visible: "How we keep you safe"
    commands:
      - tapOn: "Home"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "open-safety"
    direction: DOWN
- tapOn:
    id: "open-safety"
- extendedWaitUntil:
    visible: "Never sees your PIN"
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: "You press every button yourself"
- assertVisible: ".*SAM 3.1.*"
- assertVisible: ".*Working now.*"
- takeScreenshot: e2e-screenshots/safety-1-top
- scrollUntilVisible:
    element: "Mic off for PINs"
    direction: DOWN
- assertVisible: "Words map to buttons in code"
- takeScreenshot: e2e-screenshots/safety-2-voice
