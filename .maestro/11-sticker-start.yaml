appId: host.exp.Exponent
name: Sticker start - scanning the machine's QR opens one screen with one button
tags: [start]
---
- runFlow: subflows/close-open-guide.yaml
- openLink: exp://127.0.0.1:8081/--/start/airport
- extendedWaitUntil:
    visible: "Point your phone at the check-in kiosk."
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: "Opened from the sticker on the check-in kiosk"
- assertVisible: "I never look at your PIN. The camera switches off when a machine asks for it."
- takeScreenshot: e2e-screenshots/start-1-sticker
- tapOn:
    id: "start-button"
- extendedWaitUntil:
    visible: "Put your passport on the glass, photo page down."
    timeout: 10000
- assertVisible: "Step 1 of 4"
- takeScreenshot: e2e-screenshots/start-2-guiding
